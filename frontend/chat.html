<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChatApp - Messages</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e94560">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="user-details">
                        <h3 id="currentUsername">Chargement...</h3>
                        <span class="user-status online">
                            <i class="fas fa-circle"></i> En ligne
                        </span>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button id="themeToggleSidebar" class="icon-btn" title="Changer de thème (Ctrl+Shift+D)">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="logoutBtn" class="icon-btn logout-btn" title="Déconnexion">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="users-list-header">
                <i class="fas fa-users"></i>
                <h4>Contacts</h4>
            </div>

            <div class="users-list" id="usersList">
                <div class="loading-users">
                    <i class="fas fa-spinner fa-spin"></i> Chargement...
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="chat-user-info">
                    <div class="avatar small">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div>
                        <h3 id="chatUsername">Sélectionnez un contact</h3>
                        <span class="user-status" id="chatUserStatus">
                            <i class="fas fa-circle"></i> Hors ligne
                        </span>
                    </div>
                </div>
                <div class="chat-actions">
                    <button id="menuToggle" class="icon-btn mobile-only" style="display: none;">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="no-chat-selected">
                    <i class="fas fa-comments"></i>
                    <p>Sélectionnez un ami pour commencer à discuter</p>
                </div>
            </div>

            <div class="chat-input-container" id="chatInput" style="display: none;">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="Écrivez votre message..." 
                        rows="1"
                        maxlength="500"
                    ></textarea>
                    <button id="sendMessageBtn" class="send-btn" title="Envoyer (Entrée)">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-hint">
                    <small>Appuyez sur Entrée pour envoyer</small>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de confirmation de déconnexion -->
    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-sign-out-alt"></i>
                <h3>Déconnexion</h3>
            </div>
            <div class="modal-body">
                <p>Êtes-vous sûr de vouloir vous déconnecter ?</p>
            </div>
            <div class="modal-footer">
                <button id="cancelLogoutBtn" class="btn-secondary">Annuler</button>
                <button id="confirmLogoutBtn" class="btn-danger">Se déconnecter</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="local-api.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="chat.js"></script>
</body>
</html>

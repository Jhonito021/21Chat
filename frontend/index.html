<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#e94560">
    <title>ChatSupabase - Messages entre amis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <div class="logo-text">
                        <h2>ChatSupabase</h2>
                        <span>Premium</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="icon-btn">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <div class="user-section">
                <div class="user-card">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="username">Invité</span>
                        <span class="user-status" id="userStatus">
                            <i class="fas fa-circle"></i> Déconnecté
                        </span>
                    </div>
                </div>
                <div class="auth-buttons">
                    <button id="loginBtn" class="btn-primary btn-gradient">
                        <i class="fas fa-sign-in-alt"></i> Connexion
                    </button>
                    <button id="logoutBtn" class="btn-secondary" style="display: none;">
                        <i class="fas fa-sign-out-alt"></i> Déconnexion
                    </button>
                </div>
            </div>

            <div class="search-section">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchConversation" placeholder="Rechercher...">
                </div>
            </div>

            <div class="conversations-section">
                <div class="section-header">
                    <h3>Messages</h3>
                    <button id="newConversationBtn" class="icon-btn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="conversations-list" id="conversationsList">
                    <div class="empty-state">Aucune conversation</div>
                </div>
            </div>
        </aside>

        <!-- Zone de chat -->
        <main class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <button id="mobileMenuBtn" class="mobile-menu-btn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="chat-avatar">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <div class="chat-details">
                        <h3 id="currentChatName">ChatSupabase</h3>
                        <span class="chat-status" id="chatStatus">Sélectionnez une conversation</span>
                    </div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-chat-state">
                    <i class="fas fa-comment-dots"></i>
                    <h3>Bienvenue sur ChatSupabase</h3>
                    <p>Sélectionnez une conversation ou commencez-en une nouvelle</p>
                </div>
            </div>

            <div class="message-input-area" id="messageInputArea" style="display: none;">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Écrivez votre message..." rows="1"></textarea>
                    <button id="sendMessageBtn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Connexion -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ChatSupabase</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Connexion</button>
                    <button class="auth-tab" data-tab="register">Inscription</button>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn-primary btn-large">Se connecter</button>
                </form>
                <form id="registerForm" style="display: none;">
                    <div class="form-group">
                        <input type="text" id="registerUsername" placeholder="Nom d'utilisateur" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="registerEmail" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="registerPassword" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn-primary btn-large">S'inscrire</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Nouvelle conversation -->
    <div id="newConversationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nouvelle conversation</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <input type="text" id="searchUser" placeholder="Nom d'utilisateur...">
                </div>
                <div class="users-list" id="usersList"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="script.js"></script>
    <script>
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker enregistré avec succès:', registration.scope);
                    
                    // Vérifier les mises à jour
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('Nouveau Service Worker trouvé:', newWorker);
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('Nouvelle version disponible - rechargez la page');
                                showNotification('Une nouvelle version est disponible', 'info');
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('Erreur d\'enregistrement du Service Worker:', error);
                });
        });
    }
    
    // Gestion de la synchronisation en arrière-plan
    if ('serviceWorker' in navigator && 'SyncManager' in window) {
        navigator.serviceWorker.ready.then(registration => {
            registration.sync.register('sync-messages')
                .catch(error => console.error('Erreur d\'enregistrement sync:', error));
        });
    }
    
    // Gestion des notifications push
    if ('Notification' in window && 'PushManager' in window) {
        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                console.log('Notifications push autorisées');
            }
        });
    }
</script>
</body>
</html>

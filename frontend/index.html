<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChatApp - Connectez-vous</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e94560">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="theme-toggle">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            
            <div class="logo">
                <i class="fas fa-comments"></i>
                <h1>ChatApp</h1>
                <p>Connectez-vous avec vos amis</p>
            </div>
            
            <div class="auth-box">
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">
                        <i class="fas fa-sign-in-alt"></i> Connexion
                    </button>
                    <button class="tab-btn" data-tab="register">
                        <i class="fas fa-user-plus"></i> Inscription
                    </button>
                </div>

                <form id="loginForm" class="auth-form active">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Mot de passe" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-paper-plane"></i> Se connecter
                    </button>
                </form>

                <form id="registerForm" class="auth-form">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerUsername" placeholder="Nom d'utilisateur" required minlength="3">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="registerEmail" placeholder="Email" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="Mot de passe (min 6 caractères)" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-user-plus"></i> S'inscrire
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    
    <!-- ⚠️ ORDRE IMPORTANT : Socket.IO d'abord, puis local-api.js, puis script.js -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="local-api.js"></script>
    <script src="script.js"></script>
</body>
</html>
